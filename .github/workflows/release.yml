name: release

# Tag-driven release: `git tag v0.1.0 && git push --tags` builds all platform
# binaries and attaches them to a GitHub Release. install.sh/install.ps1
# download these assets from the `latest` release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/release/*)
          if ((${#files[@]} == 0)); then
            echo "No release assets found in dist/release" >&2
            exit 1
          fi

          repo_args=(--repo "$GITHUB_REPOSITORY")
          if gh release view "$GITHUB_REF_NAME" "${repo_args[@]}" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber "${repo_args[@]}"
          else
            create_args=("${repo_args[@]}" --verify-tag --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${create_args[@]}" "${files[@]}"
          fi
